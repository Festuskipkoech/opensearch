use_default_settings: true

general:
  debug: false
  instance_name: "OpenSearch"

server:
  limiter: false
  image_proxy: false
  http_protocol_version: "1.1"
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_theme: simple

engines:
  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: true

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false

  - name: yandex
    engine: yandex
    shortcut: yx
    disabled: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
